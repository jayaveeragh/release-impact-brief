[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "release-impact-brief"
version = "0.0.1"
description = "Explain a public GitHub repo visually and brief the release impact of a likely bug fix."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25.2,<0.26",  # 0.26.0 segfaults on some Java files, see PROJECT_NOTES.md
    "tree-sitter-java>=0.23.5",
]

[project.scripts]
rib = "release_impact_brief.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "pytest>=9.2",
    "mypy>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/release_impact_brief"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = ["network: needs internet access to github.com (run with -m network)"]
